<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login — Ayushman Patient Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary:#234123;--primary-600:#1d361d;--accent:#7cc58f;
      --text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--bg:#f8f8f3;
      --shadow:0 10px 30px rgba(35,65,35,0.12);--radius:14px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:'Inter',sans-serif;background:var(--bg);min-height:100vh;
      display:flex;align-items:center;justify-content:center;padding:20px;
      background-image:radial-gradient(ellipse at 20% 50%,rgba(124,197,143,0.18) 0%,transparent 60%),
                       radial-gradient(ellipse at 80% 20%,rgba(35,65,35,0.07) 0%,transparent 50%);
    }
    .auth-container{width:100%;max-width:420px;}
    .auth-logo-wrap{text-align:center;margin-bottom:24px;}
    .auth-logo-icon{
      width:62px;height:62px;border-radius:15px;background:var(--primary);
      display:inline-flex;align-items:center;justify-content:center;
      font-size:2rem;margin-bottom:10px;box-shadow:0 4px 20px rgba(35,65,35,0.28);
    }
    .auth-logo-title{font-size:1.35rem;font-weight:800;color:var(--primary);}
    .auth-logo-sub{font-size:0.8rem;color:var(--muted);margin-top:4px;}
    .auth-card{
      background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
      padding:32px 28px;border:1px solid rgba(229,231,235,0.8);
      animation:fadeUp 0.35s cubic-bezier(0.175,0.885,0.32,1.1) both;
    }
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    .auth-card h2{font-size:1.22rem;font-weight:700;color:var(--text);margin-bottom:5px;}
    .auth-card .subtitle{font-size:0.84rem;color:var(--muted);margin-bottom:22px;}
    .form-group{margin-bottom:15px;}
    label{display:block;font-size:0.81rem;font-weight:600;color:var(--text);margin-bottom:5px;}
    input{
      width:100%;padding:10px 13px;font-family:'Inter',sans-serif;font-size:0.93rem;
      border-radius:8px;border:1.5px solid var(--border);background:#fafafa;
      color:var(--text);outline:none;transition:border-color 0.2s,box-shadow 0.2s;
    }
    input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(35,65,35,0.12);background:#fff;}
    .pw-wrap{position:relative;}
    .pw-toggle{
      position:absolute;right:10px;top:50%;transform:translateY(-50%);
      background:none;border:none;cursor:pointer;color:var(--muted);font-size:0.82rem;padding:4px;
    }
    .btn{
      width:100%;padding:11px;font-family:'Inter',sans-serif;font-size:1rem;font-weight:700;
      background:var(--primary);color:#fff;border:none;border-radius:8px;cursor:pointer;
      box-shadow:0 4px 14px rgba(35,65,35,0.2);transition:background 0.18s,transform 0.1s;margin-top:4px;
    }
    .btn:hover{background:var(--primary-600);transform:translateY(-1px);}
    .btn:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
    .msg-error{
      color:#b91c1c;background:#fef2f2;border-left:4px solid #dc2626;
      padding:10px 14px;border-radius:6px;font-size:0.84rem;font-weight:500;margin-top:12px;
    }
    .hidden{display:none!important;}
    .auth-switch{text-align:center;margin-top:20px;font-size:0.88rem;color:var(--muted);}
    .auth-switch a{color:var(--primary);font-weight:600;}
    .auth-switch a:hover{text-decoration:underline;}
    .divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--muted);font-size:0.78rem;}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-logo-wrap">
      <div class="auth-logo-icon">🌿</div>
      <div class="auth-logo-title">Ayushman Bhava</div>
      <div class="auth-logo-sub">Patient Management System</div>
    </div>
    <div class="auth-card">
      <h2>Welcome back 👋</h2>
      <p class="subtitle">Sign in to continue to your clinic dashboard</p>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="doctor@clinic.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="pw-wrap">
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
            <button type="button" class="pw-toggle" id="pwToggle">Show</button>
          </div>
        </div>
        <button class="btn" type="submit" id="loginBtn">
          <span id="btnText">Sign In</span>
          <span id="btnLoader" class="hidden">Signing in…</span>
        </button>
      </form>
      <div id="loginMsg" class="hidden"></div>
      <div class="divider">or</div>
      <div class="auth-switch">Don't have an account? <a href="register.html">Register here</a></div>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script>
    Auth.requireGuest();
    const pwInput = document.getElementById('password');
    const pwToggle = document.getElementById('pwToggle');
    pwToggle.addEventListener('click', () => {
      const vis = pwInput.type === 'password';
      pwInput.type = vis ? 'text' : 'password';
      pwToggle.textContent = vis ? 'Hide' : 'Show';
    });
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const msg = document.getElementById('loginMsg');
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      const btnLoad = document.getElementById('btnLoader');
      msg.className = 'hidden';
      btn.disabled = true; btnText.classList.add('hidden'); btnLoad.classList.remove('hidden');
      setTimeout(() => {
        const result = Auth.loginUser(email, password);
        btn.disabled = false; btnText.classList.remove('hidden'); btnLoad.classList.add('hidden');
        if (result.ok) {
          window.location.href = 'index.html';
        } else {
          msg.textContent = result.error; msg.className = 'msg-error';
        }
      }, 400);
    });
  </script>
</body>
</html>
