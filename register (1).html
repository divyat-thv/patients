<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Register — Ayushman Patient Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary:#234123;--primary-600:#1d361d;--accent:#7cc58f;
      --text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--bg:#f8f8f3;
      --shadow:0 10px 30px rgba(35,65,35,0.12);--radius:14px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:'Inter',sans-serif;background:var(--bg);min-height:100vh;
      display:flex;align-items:center;justify-content:center;padding:24px 20px;
      background-image:radial-gradient(ellipse at 80% 80%,rgba(124,197,143,0.16) 0%,transparent 60%);
    }
    .auth-container{width:100%;max-width:500px;}
    .auth-logo-wrap{text-align:center;margin-bottom:20px;}
    .auth-logo-icon{
      width:56px;height:56px;border-radius:14px;background:var(--primary);
      display:inline-flex;align-items:center;justify-content:center;
      font-size:1.7rem;margin-bottom:8px;box-shadow:0 4px 16px rgba(35,65,35,0.25);
    }
    .auth-logo-title{font-size:1.28rem;font-weight:800;color:var(--primary);}
    .auth-logo-sub{font-size:0.78rem;color:var(--muted);margin-top:3px;}
    .auth-card{
      background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
      padding:26px 24px;border:1px solid rgba(229,231,235,0.8);
      animation:fadeUp 0.35s cubic-bezier(0.175,0.885,0.32,1.1) both;
    }
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    .auth-card h2{font-size:1.15rem;font-weight:700;color:var(--text);margin-bottom:4px;}
    .auth-card .subtitle{font-size:0.82rem;color:var(--muted);margin-bottom:18px;}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .form-group{display:flex;flex-direction:column;gap:4px;}
    .form-group.full{grid-column:1/-1;}
    label{font-size:0.79rem;font-weight:600;color:var(--text);}
    .required-star{color:#dc2626;margin-left:2px;}
    input,select{
      width:100%;padding:9px 12px;font-family:'Inter',sans-serif;font-size:0.91rem;
      border-radius:8px;border:1.5px solid var(--border);background:#fafafa;
      color:var(--text);outline:none;transition:border-color 0.2s,box-shadow 0.2s;
    }
    input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(35,65,35,0.1);background:#fff;}
    .pw-wrap{position:relative;}
    .pw-toggle{
      position:absolute;right:10px;top:50%;transform:translateY(-50%);
      background:none;border:none;cursor:pointer;color:var(--muted);font-size:0.8rem;padding:4px;
    }
    .section-label{
      font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;
      color:var(--muted);margin:12px 0 8px;grid-column:1/-1;
      padding-bottom:6px;border-bottom:1px solid var(--border);
    }
    .btn{
      width:100%;padding:11px;font-family:'Inter',sans-serif;font-size:0.98rem;font-weight:700;
      background:var(--primary);color:#fff;border:none;border-radius:8px;cursor:pointer;
      box-shadow:0 4px 14px rgba(35,65,35,0.2);transition:background 0.18s,transform 0.1s;margin-top:6px;
    }
    .btn:hover{background:var(--primary-600);transform:translateY(-1px);}
    .btn:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
    .msg-error{color:#b91c1c;background:#fef2f2;border-left:4px solid #dc2626;padding:10px 14px;border-radius:6px;font-size:0.83rem;font-weight:500;margin-top:12px;}
    .msg-success{color:#166534;background:#f0fdf4;border-left:4px solid #16a34a;padding:10px 14px;border-radius:6px;font-size:0.83rem;font-weight:500;margin-top:12px;}
    .hidden{display:none!important;}
    .auth-switch{text-align:center;margin-top:16px;font-size:0.86rem;color:var(--muted);}
    .auth-switch a{color:var(--primary);font-weight:600;}
    .auth-switch a:hover{text-decoration:underline;}
    @media(max-width:480px){.form-grid{grid-template-columns:1fr;}.form-group.full{grid-column:1;}}
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-logo-wrap">
      <div class="auth-logo-icon">🌿</div>
      <div class="auth-logo-title">Ayushman Bhava</div>
      <div class="auth-logo-sub">Patient Management System</div>
    </div>
    <div class="auth-card">
      <h2>Create your account</h2>
      <p class="subtitle">Register to start managing your clinic patients</p>
      <form id="regForm" novalidate>
        <div class="form-grid">
          <div class="section-label">👤 Personal Details</div>
          <div class="form-group">
            <label>Full Name <span class="required-star">*</span></label>
            <input type="text" id="name" placeholder="Dr. Ravi Sharma" required>
          </div>
          <div class="form-group">
            <label>Mobile Number <span class="required-star">*</span></label>
            <input type="tel" id="phone" placeholder="9876543210" maxlength="10">
          </div>
          <div class="form-group full">
            <label>Email Address <span class="required-star">*</span></label>
            <input type="email" id="email" placeholder="doctor@ayurveda.com" autocomplete="email">
          </div>
          <div class="section-label">🏥 Clinic Details</div>
          <div class="form-group full">
            <label>Clinic / Hospital Name</label>
            <input type="text" id="clinic" placeholder="Vasavi Ayurveda Centre">
          </div>
          <div class="form-group">
            <label>City</label>
            <input type="text" id="city" placeholder="Hyderabad">
          </div>
          <div class="form-group">
            <label>Specialisation</label>
            <select id="specialisation">
              <option value="">— Select —</option>
              <option>General Ayurveda</option>
              <option>Panchakarma</option>
              <option>Kaya Chikitsa</option>
              <option>Shalya Tantra</option>
              <option>Shalakya Tantra</option>
              <option>Prasuti &amp; Stree Roga</option>
              <option>Kaumar Bhritya</option>
              <option>Other</option>
            </select>
          </div>
          <div class="section-label">🔒 Set Password</div>
          <div class="form-group">
            <label>Password <span class="required-star">*</span></label>
            <div class="pw-wrap">
              <input type="password" id="password" placeholder="Min. 6 characters">
              <button type="button" class="pw-toggle" id="pw1Toggle">Show</button>
            </div>
          </div>
          <div class="form-group">
            <label>Confirm Password <span class="required-star">*</span></label>
            <div class="pw-wrap">
              <input type="password" id="confirmPassword" placeholder="Re-enter password">
              <button type="button" class="pw-toggle" id="pw2Toggle">Show</button>
            </div>
          </div>
        </div>
        <button class="btn" type="submit" id="regBtn">
          <span id="btnText">Create Account</span>
          <span id="btnLoader" class="hidden">Creating account…</span>
        </button>
      </form>
      <div id="regMsg" class="hidden"></div>
      <div class="auth-switch">Already have an account? <a href="login.html">Sign in here</a></div>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script>
    Auth.requireGuest();
    function makeToggle(inputId, btnId) {
      const inp = document.getElementById(inputId), btn = document.getElementById(btnId);
      btn.addEventListener('click', () => {
        const vis = inp.type === 'password'; inp.type = vis ? 'text' : 'password';
        btn.textContent = vis ? 'Hide' : 'Show';
      });
    }
    makeToggle('password','pw1Toggle'); makeToggle('confirmPassword','pw2Toggle');
    document.getElementById('phone').addEventListener('input', function() {
      this.value = this.value.replace(/\D/g,'').slice(0,10);
    });
    document.getElementById('regForm').addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const email = document.getElementById('email').value.trim();
      const clinic = document.getElementById('clinic').value.trim();
      const city = document.getElementById('city').value.trim();
      const spec = document.getElementById('specialisation').value;
      const pw = document.getElementById('password').value;
      const cpw = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('regBtn');
      const btnT = document.getElementById('btnText'); const btnL = document.getElementById('btnLoader');
      if (!name)             return showMsg('Please enter your full name.', false);
      if (!phone || phone.length < 10) return showMsg('Enter a valid 10-digit mobile number.', false);
      if (!email)            return showMsg('Please enter your email address.', false);
      if (pw.length < 6)     return showMsg('Password must be at least 6 characters.', false);
      if (pw !== cpw)        return showMsg('Passwords do not match.', false);
      btn.disabled = true; btnT.classList.add('hidden'); btnL.classList.remove('hidden');
      document.getElementById('regMsg').className = 'hidden';
      setTimeout(() => {
        const result = Auth.registerUser({ name, email, password: pw, phone, clinic, city, specialisation: spec });
        btn.disabled = false; btnT.classList.remove('hidden'); btnL.classList.add('hidden');
        if (result.ok) {
          showMsg('✅ Account created! Redirecting to login…', true);
          setTimeout(() => window.location.href = 'login.html', 1500);
        } else { showMsg(result.error, false); }
      }, 500);
    });
    function showMsg(text, success) {
      const msg = document.getElementById('regMsg');
      msg.textContent = text;
      msg.className = success ? 'msg-success' : 'msg-error';
    }
  </script>
</body>
</html>
